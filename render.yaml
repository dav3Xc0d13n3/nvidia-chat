services:
  - type: web
    name: nvidia-chat
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build && cd backend && npm install --include=dev
    startCommand: node backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NODE_VERSION
        value: 22.12.0
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nvidia-chat-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://nvidia-chat.onrender.com
      - key: VITE_NVIDIA_API_KEY
        sync: false
      - key: VITE_NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: VITE_NVIDIA_MODEL
        value: nvidia/nemotron-3-ultra
      - key: VITE_API_URL
        value: /api
    healthCheckPath: /api/health

databases:
  - name: nvidia-chat-db
    plan: free
    databaseName: nvidia_chat
    user: nvidia_chat_user