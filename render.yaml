services:
  - type: web
    name: nvidia-chat-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NODE_VERSION
        value: 22.12.0
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nvidia-chat-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://nvidia-chat.onrender.com
    healthCheckPath: /api/health

  - type: web
    name: nvidia-chat
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: VITE_NVIDIA_API_KEY
        sync: false
      - key: VITE_NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: VITE_NVIDIA_MODEL
        value: meta/llama-3.1-405b-instruct
      - key: VITE_API_URL
        value: https://nvidia-chat-api-abl0.onrender.com/api
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: nvidia-chat-db
    plan: free
    databaseName: nvidia_chat
    user: nvidia_chat_user