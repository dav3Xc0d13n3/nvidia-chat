services:
  - type: web
    name: nvidia-chat-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nvidia-chat-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://nvidia-chat.onrender.com
    healthCheckPath: /api/health

databases:
  - name: nvidia-chat-db
    plan: free
    databaseName: nvidia_chat
    user: nvidia_chat_user